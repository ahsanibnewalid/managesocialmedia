name: Production readiness checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit summary
        run: |
          npm audit --json > /tmp/npm-audit-full.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-prod.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          for (const [label, file] of [["full", "/tmp/npm-audit-full.json"], ["production", "/tmp/npm-audit-prod.json"]]) {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            const metadata = report.metadata?.vulnerabilities || {};
            const items = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
              name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable,
              advisories: (item.via || []).map(v => typeof v === "string" ? v : ({ title: v.title, url: v.url, range: v.range }))
            }));
            console.log(JSON.stringify({ audit: label, totals: metadata, packages: items }, null, 2));
            if (Number(metadata.total || 0) > 0) process.exitCode = 1;
          }
          NODE
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Automated tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tidepost
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-only-not-a-production-secret-123456789
          SOCIAL_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
