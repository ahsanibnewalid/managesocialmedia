name: Node.js checks
on:
  push:
    branches: [main, feat/full-stack-foundation, feat/nextjs-migration]
  pull_request:
    branches: [main]
permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tidepost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tidepost_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tidepost_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-with-more-than-32-characters
      SOCIAL_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Export resolved dependency lockfile for audit
        uses: actions/upload-artifact@v4
        with:
          name: audit-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Commit updated lockfile on the trusted audit branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/full-production-readiness' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api --method PUT "repos/${REPOSITORY}/contents/package-lock.json" \
            --field message="build(deps): lock Express server dependencies" \
            --field branch="${TARGET_BRANCH}" \
            --field sha="$(gh api "repos/${REPOSITORY}/contents/package-lock.json?ref=${TARGET_BRANCH}" --jq .sha)" \
            --field content="$(base64 -w0 package-lock.json)"
          npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: node --check server/index.js
      - run: node --check server/publishing-queue.js
      - run: node --check server/publishing-adapters.js
      - run: node --import tsx -e "require('./server/publishing-adapters')"
      - run: node --check server/publishing-worker.js
      - run: node --check public/api-bridge.js
