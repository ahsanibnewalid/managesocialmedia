name: Node.js checks
on:
  push:
    branches: [main, feat/full-stack-foundation]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server/index.js
      - run: node --check server/publishing-queue.js
      - run: node --check server/publishing-adapters.js
      - run: node --check server/publishing-worker.js
      - run: node --check public/api-bridge.js
