<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" rx="24" fill="#f1f5f9"/><rect x="28" y="28" width="944" height="564" rx="20" fill="#fff"/><text x="64" y="82" font-family="Arial" font-size="30" font-weight="bold" fill="#111827">Start Tidepost in six steps</text><text x="64" y="116" font-family="Arial" font-size="15" fill="#64748b">BEGINNER ROADMAP • SEE THE GUIDE FOR EXACT COMMANDS</text><rect x="76" y="150" width="848" height="54" rx="11" fill="#eef2ff"/><circle cx="108" cy="177" r="16" fill="#4f46e5"/><text x="103" y="183" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">1</text><text x="140" y="173" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Install prerequisites</text><text x="140" y="192" font-family="Arial" font-size="12" fill="#64748b">Node.js, PostgreSQL and Redis</text><rect x="76" y="216" width="848" height="54" rx="11" fill="#f8fafc"/><circle cx="108" cy="243" r="16" fill="#4f46e5"/><text x="103" y="249" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">2</text><text x="140" y="239" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Create your settings file</text><text x="140" y="258" font-family="Arial" font-size="12" fill="#64748b">Copy .env.example to .env</text><rect x="76" y="282" width="848" height="54" rx="11" fill="#eef2ff"/><circle cx="108" cy="309" r="16" fill="#4f46e5"/><text x="103" y="315" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">3</text><text x="140" y="305" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Prepare the database</text><text x="140" y="324" font-family="Arial" font-size="12" fill="#64748b">Run the documented migrations</text><rect x="76" y="348" width="848" height="54" rx="11" fill="#f8fafc"/><circle cx="108" cy="375" r="16" fill="#4f46e5"/><text x="103" y="381" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">4</text><text x="140" y="371" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Start the web dashboard</text><text x="140" y="390" font-family="Arial" font-size="12" fill="#64748b">Open it in your browser</text><rect x="76" y="414" width="848" height="54" rx="11" fill="#eef2ff"/><circle cx="108" cy="441" r="16" fill="#4f46e5"/><text x="103" y="447" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">5</text><text x="140" y="437" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Start the background worker</text><text x="140" y="456" font-family="Arial" font-size="12" fill="#64748b">Run it in a second terminal</text><rect x="76" y="480" width="848" height="54" rx="11" fill="#f8fafc"/><circle cx="108" cy="507" r="16" fill="#4f46e5"/><text x="103" y="513" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">6</text><text x="140" y="503" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Connect social accounts</text><text x="140" y="522" font-family="Arial" font-size="12" fill="#64748b">Approve access on each platform</text></svg>