<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#f8fafc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Publishing &amp; Retry Flow</text><text x="600" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">A post moves from authorization through the queue to provider adapters</text><g font-family="Arial,sans-serif"><rect x="55" y="175" width="190" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150" y="215" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">1. Compose</text><text x="150" y="244" text-anchor="middle" font-size="14" fill="#334155">Validate content</text><text x="150" y="264" text-anchor="middle" font-size="14" fill="#334155">+ workspace access</text><rect x="315" y="175" width="190" height="100" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="410" y="215" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">2. Queue</text><text x="410" y="244" text-anchor="middle" font-size="14" fill="#334155">PostgreSQL record</text><text x="410" y="264" text-anchor="middle" font-size="14" fill="#334155">+ BullMQ job</text><rect x="575" y="175" width="190" height="100" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="670" y="215" text-anchor="middle" font-size="19" font-weight="700" fill="#9d174d">3. Worker</text><text x="670" y="244" text-anchor="middle" font-size="14" fill="#334155">Execute adapter</text><text x="670" y="264" text-anchor="middle" font-size="14" fill="#334155">with retry/backoff</text><rect x="835" y="175" width="190" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="930" y="215" text-anchor="middle" font-size="19" font-weight="700" fill="#92400e">4. Provider</text><text x="930" y="244" text-anchor="middle" font-size="14" fill="#334155">Meta / LinkedIn</text><text x="930" y="264" text-anchor="middle" font-size="14" fill="#334155">X / TikTok</text><rect x="410" y="380" width="380" height="95" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="600" y="417" text-anchor="middle" font-size="19" font-weight="700" fill="#5b21b6">Failure / uncertainty handling</text><text x="600" y="445" text-anchor="middle" font-size="14" fill="#334155">Retry transient errors; reconcile provider acceptance after crashes</text><g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M245 225H305"/><path d="M505 225H565"/><path d="M765 225H825"/><path d="M670 275V375"/><path d="M835 300C790 360 760 395 790 425"/></g></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs></svg>